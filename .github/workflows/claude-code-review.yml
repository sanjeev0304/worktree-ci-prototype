name: Claude Code Review

# Layer 2 of the PR review: an asynchronous, advisory LLM review. It posts comments but
# never blocks a merge; merging is gated by the deterministic checks in worktree-ci-gate.yml.
#
# Setup (repo admin, once): Settings → Secrets and variables → Actions →
#   New repository secret ANTHROPIC_API_KEY. Without it, this workflow skips with a notice.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review (advisory)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::Add the ANTHROPIC_API_KEY repository secret to enable the AI review."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0

      - name: Review the PR with Claude
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the advisory code reviewer for this repository. Read CLAUDE.md,
            docs/ARCHITECTURE.md, docs/BUSINESS_RULES.md and docs/SAFETY_GUARDRAILS.md first,
            then review the diff of this pull request (gh pr diff).

            Report only real problems, most severe first:
            - correctness bugs and crashes
            - breaks of the business rules (e.g. RULE #404) or architecture boundaries
              (src/core-engine.js is Lead-Architect-only; the UI layer uses core's public API only)
            - security issues
            - changes that weaken a CI gate, hook or guardrail

            Put each finding as an inline comment on the line it is about, then post one short
            summary comment on the PR. If you find nothing, say so in the summary. Do not
            approve or request changes; this review is advisory.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
