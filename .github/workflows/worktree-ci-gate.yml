name: Worktree CI Gate

# Layer 1 of the PR review: deterministic checks. Every job here must pass to merge.
# Two kinds of PR (see CLAUDE.md "Deployment pipeline"):
#   task PR     <type>/<id>-<slug> -> qa     every guardrail below
#   release PR  qa -> main                   bundles task PRs that already passed this gate,
#                                            so size, branch, linked-task and manual checks are
#                                            skipped; main accepts no other PRs.
# (Layer 2, the advisory Claude code review, is in claude-code-review.yml.)

on:
  pull_request:
    branches: [main, qa]
    # "edited" re-runs the gate when the PR body (manual check, Closes #N) changes.
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Typecheck · Unit · E2E · Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, including architecture boundary rules)
        run: npm run lint
      - name: Typecheck (tsc --checkJs)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: E2E tests
        run: npm run test:e2e
      - name: Smoke test
        run: npm run test:smoke

  audit-evidence:
    name: Audit evidence (artifact, not committed)
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the screenshot to the qa-evidence-images branch
      pull-requests: write
    env:
      # Screenshots live on an orphan branch that is never merged, so the PR comment can
      # show them inline while qa-evidence/ stays out of every PR.
      IMAGE_BRANCH: qa-evidence-images
      IMAGE_PATH: pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}.png
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD^1 is main: the diff decides which evidence this PR needs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the pre-PR audit (evidence for what this PR changed)
        env:
          AUDIT_BRANCH: ${{ github.head_ref }}
          AUDIT_BASE: HEAD^1
          EVIDENCE_IMAGE_URL: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('https://github.com/{0}/blob/{1}/{2}?raw=true', github.repository, env.IMAGE_BRANCH, env.IMAGE_PATH) || '' }}
        run: node scripts/run-pre-pr-audit.js --ci
      - name: Publish the screenshot for the PR comment (UI changes only)
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$(node -p "require('./qa-evidence/scope.json').ui")" != "true" ] || [ ! -f qa-evidence/latest-ui-proof.png ]; then
            echo "No UI change in this PR: no screenshot to publish."; exit 0
          fi
          # Create the orphan branch on first use (a single README commit, no history from main).
          if ! gh api "repos/$REPO/git/ref/heads/$IMAGE_BRANCH" > /dev/null 2>&1; then
            tree="$(gh api "repos/$REPO/git/trees" -f 'tree[][path]=README.md' -f 'tree[][mode]=100644' -f 'tree[][type]=blob' \
                     -f 'tree[][content]=PR screenshots posted by the Worktree CI Gate. Never merged.' --jq .sha)"
            commit="$(gh api "repos/$REPO/git/commits" -f message="Start $IMAGE_BRANCH" -f tree="$tree" --jq .sha)"
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$IMAGE_BRANCH" -f sha="$commit" > /dev/null || true
          fi
          base64 -w0 qa-evidence/latest-ui-proof.png > image.b64
          for attempt in 1 2 3; do
            sha="$(gh api "repos/$REPO/contents/$IMAGE_PATH?ref=$IMAGE_BRANCH" --jq .sha 2>/dev/null || true)"
            if gh api -X PUT "repos/$REPO/contents/$IMAGE_PATH" -f message="Screenshot for PR #$PR" -f branch="$IMAGE_BRANCH" \
                 -F content=@image.b64 ${sha:+-f sha="$sha"} > /dev/null; then
              echo "Published $IMAGE_PATH to $IMAGE_BRANCH."; exit 0
            fi
            sleep $((attempt * 3)) # another PR pushed to the branch at the same moment: retry
          done
          echo "::warning::Could not publish the screenshot; it is still in the qa-evidence artifact."
      - name: Upload qa-evidence as a GitHub Actions artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: qa-evidence/
          retention-days: 30
      - name: Post the evidence on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "<!-- ci-audit-evidence -->"
            echo "📎 **Report + screenshot download:** [qa-evidence artifact]($ARTIFACT_URL) · \`gh run download ${{ github.run_id }} -n qa-evidence\`"
            echo
            cat qa-evidence/PR_AUDIT_REPORT.md
          } > comment.md
          # One sticky comment per PR, updated on every push.
          id="$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
                --jq '.[] | select(.body | startswith("<!-- ci-audit-evidence -->")) | .id' | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

  safety-gate:
    name: Safety & Blast Radius Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (full history for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyse blast radius and write executive report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Lead Architect(s) (Person A): the only authors allowed to change the core layer.
          LEAD_ARCHITECTS: sanjeev0304
        run: |
          set -euo pipefail

          CORE_FILE="src/core-engine.js"
          MAX_LINES=80
          # Only application code counts toward the blast radius. Governance files
          # (.github/, scripts/, docs) are gated by CODEOWNERS review instead.
          SIZE_SCOPE_RE='^(src|tests)/'

          git fetch --no-tags origin "$BASE_REF"
          RANGE="origin/${BASE_REF}...HEAD"
          IS_RELEASE=false
          [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "qa" ] && IS_RELEASE=true

          NUMSTAT="$(git diff --numstat "$RANGE")"
          ADDED=0; REMOVED=0; FILE_ROWS=""; FILE_COUNT=0; CORE_TOUCHED=false; EVIDENCE_COMMITTED=false

          while IFS=$'\t' read -r add del file; do
            [ -z "${file:-}" ] && continue
            [ "$add" = "-" ] && add=0
            [ "$del" = "-" ] && del=0
            FILE_COUNT=$((FILE_COUNT + 1))
            marker=""
            if [[ "$file" =~ $SIZE_SCOPE_RE ]]; then
              ADDED=$((ADDED + add)); REMOVED=$((REMOVED + del))
            else
              marker=" _not counted_"
            fi
            if [ "$file" = "$CORE_FILE" ]; then CORE_TOUCHED=true; marker=" ⛔ **RESTRICTED**"; fi
            FILE_ROWS="${FILE_ROWS}| \`${file}\`${marker} | +${add} | -${del} |"$'\n'
          done <<< "$NUMSTAT"
          git diff --name-only "$RANGE" | grep -qx "$CORE_FILE" && CORE_TOUCHED=true
          # Binary files show "-" in numstat; catch any newly added qa-evidence file too.
          git diff --name-only --diff-filter=AM "$RANGE" -- qa-evidence/ | grep -q . && EVIDENCE_COMMITTED=true

          TOTAL=$((ADDED + REMOVED))
          FAIL=false; REASONS=""
          fail() { FAIL=true; REASONS="${REASONS}- $1"$'\n'; }

          # 0. main only takes the release PR from qa; task PRs go to qa first.
          if [ "$BASE_REF" = "main" ] && [ "$IS_RELEASE" = false ]; then
            fail "PRs into \`main\` must come from \`qa\` (release PR). Open this PR against \`qa\` instead."
          fi

          # 1. Core layer: only the Lead Architect may change it.
          IS_LEAD=false
          for lead in $LEAD_ARCHITECTS; do [ "$PR_AUTHOR" = "$lead" ] && IS_LEAD=true; done
          if [ "$CORE_TOUCHED" = true ] && [ "$IS_RELEASE" = true ]; then
            CORE_STATUS="⚪ **RELEASE**: core changes were gated on their PR into \`qa\`."
          elif [ "$CORE_TOUCHED" = true ] && [ "$IS_LEAD" = false ]; then
            CORE_STATUS="🔴 **VIOLATION**: \`${CORE_FILE}\` was modified by @${PR_AUTHOR}. Only the Lead Architect may change it."
            fail "Restricted core file \`${CORE_FILE}\` was modified by a non-Lead Architect."
          elif [ "$CORE_TOUCHED" = true ]; then
            CORE_STATUS="🟡 **LEAD ARCHITECT CHANGE**: \`${CORE_FILE}\` modified by @${PR_AUTHOR}."
          else
            CORE_STATUS="🟢 **SAFE**: \`${CORE_FILE}\` was not touched."
          fi

          # 2. Blast radius of application code.
          if [ "$IS_RELEASE" = true ]; then
            SIZE_STATUS="⚪ **RELEASE**: ${TOTAL} app-code lines from task PRs that each passed the ${MAX_LINES}-line limit."
          elif [ "$TOTAL" -gt "$MAX_LINES" ]; then
            SIZE_STATUS="🔴 **TOO LARGE**: ${TOTAL} app-code lines changed (limit ${MAX_LINES})."
            fail "${TOTAL} lines changed in src/ + tests/, over the ${MAX_LINES}-line limit. Split this PR."
          else
            SIZE_STATUS="🟢 **WITHIN LIMIT**: ${TOTAL} of ${MAX_LINES} app-code lines (src/ + tests/)."
          fi

          # 3. No binary/test-run evidence in Git.
          if [ "$EVIDENCE_COMMITTED" = true ]; then
            EVIDENCE_STATUS="🔴 **COMMITTED**: qa-evidence/ files are in this PR. Evidence lives in Actions artifacts only."
            fail "qa-evidence/ files were committed. Run \`git rm -r --cached qa-evidence\`."
          else
            EVIDENCE_STATUS="🟢 **NOT IN GIT**: evidence is uploaded as the \`qa-evidence\` Actions artifact."
          fi

          # 4. Branch naming: <type>/<issue-id>-<short-description>.
          if [ "$IS_RELEASE" = true ]; then
            BRANCH_ISSUE=""
            BRANCH_STATUS="🟢 **RELEASE**: \`qa\` → \`main\`."
          elif node scripts/lib/branch-name.js check "$HEAD_REF" 2>/dev/null; then
            BRANCH_ISSUE="$(sed -E 's#^[a-z]+/([0-9]+)-.*#\1#' <<< "$HEAD_REF")"
            BRANCH_STATUS="🟢 **VALID**: \`${HEAD_REF}\` (issue #${BRANCH_ISSUE})."
          else
            BRANCH_ISSUE=""
            BRANCH_STATUS="🔴 **INVALID**: \`${HEAD_REF}\` is not \`<type>/<issue-id>-<short-description>\`."
            fail "Branch \`${HEAD_REF}\` does not follow \`<type>/<issue-id>-<short-description>\` (e.g. fix/104-login-timeout)."
          fi

          # 5. Linked task: "Closes #N" matches the branch issue, and the issue is still open
          #    (it may only close when this PR merges: no premature closure).
          CLOSES="$(grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<< "${PR_BODY:-}" | grep -oE '[0-9]+' | head -1 || true)"
          TASK_STATUS=""
          if [ "$IS_RELEASE" = true ]; then
            TASK_STATUS="⚪ **RELEASE**: tasks were linked and closed on their PRs into \`qa\`."
          elif [ -z "$CLOSES" ]; then
            fail "PR body has no \`Closes #<issue>\`. Use \`qa-evidence/PR_AUDIT_REPORT.md\` as the body."
            TASK_STATUS="🔴 **MISSING**: no \`Closes #<issue>\` in the PR body."
          elif [ -n "$BRANCH_ISSUE" ] && [ "$CLOSES" != "$BRANCH_ISSUE" ]; then
            fail "PR body closes #${CLOSES} but the branch is for issue #${BRANCH_ISSUE}."
            TASK_STATUS="🔴 **MISMATCH**: body closes #${CLOSES}, branch is #${BRANCH_ISSUE}."
          else
            STATE="$(gh api "repos/${REPO}/issues/${CLOSES}" --jq 'if .pull_request then "pr" else .state end' 2>/dev/null || echo missing)"
            case "$STATE" in
              open) TASK_STATUS="🟢 **LINKED**: issue #${CLOSES} is open and closes when this PR merges into \`${BASE_REF}\`." ;;
              closed) fail "Issue #${CLOSES} is already closed. Tasks close only when their PR merges."
                      TASK_STATUS="🔴 **CLOSED EARLY**: issue #${CLOSES} was closed before merge." ;;
              *) fail "Issue #${CLOSES} does not exist in ${REPO}."
                 TASK_STATUS="🔴 **NOT FOUND**: #${CLOSES} is not an issue." ;;
            esac
          fi

          # 6. Manual check (Protocol RULE 3) recorded in the PR body.
          if [ "$IS_RELEASE" = true ]; then
            MANUAL_STATUS="⚪ **RELEASE**: manual checks were recorded on each PR into \`qa\`."
          elif grep -qF "Manual check passed" <<< "${PR_BODY:-}"; then
            MANUAL_STATUS="🟢 **CONFIRMED** in the PR body."
          else
            MANUAL_STATUS="🔴 **MISSING**: run \`node scripts/run-pre-pr-audit.js --manual-passed \"<notes>\"\` and use the report as the PR body."
            fail "Manual verification (Protocol RULE 3) not recorded in the PR body."
          fi

          [ -z "$FILE_ROWS" ] && FILE_ROWS="| _(no file changes)_ | | |"$'\n'
          {
            echo "# 🛡️ Executive Safety & Blast Radius Report"
            echo
            echo "**PR #${PR_NUMBER}:** ${PR_TITLE}  "
            echo "**Author:** @${PR_AUTHOR} · **Branch:** \`${HEAD_REF}\` → \`${BASE_REF}\`"
            echo
            echo "## a) Files modified (${FILE_COUNT})"
            echo
            echo "| File | Added | Removed |"
            echo "|---|---:|---:|"
            printf '%s' "$FILE_ROWS"
            echo
            echo "## b) Checks"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| App-code lines (+${ADDED} −${REMOVED}) | ${SIZE_STATUS} |"
            echo "| Core architecture | ${CORE_STATUS} |"
            echo "| Branch name | ${BRANCH_STATUS} |"
            echo "| Linked task | ${TASK_STATUS} |"
            echo "| Manual check | ${MANUAL_STATUS} |"
            echo "| Evidence storage | ${EVIDENCE_STATUS} |"
            echo
            echo "Lint, typecheck, unit, e2e and smoke tests run in the **checks** job."
            echo
            echo "## c) Final verdict"
            echo
            if [ "$FAIL" = true ]; then
              echo "> ### ❌ BLOCKED: do not merge"
              echo
              printf '%s' "$REASONS"
            else
              echo "> ### ✅ APPROVED FOR REVIEW"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Files: ${FILE_COUNT} | app-code lines: ${TOTAL} | core touched: ${CORE_TOUCHED} | branch: ${HEAD_REF} | closes: #${CLOSES:-none}"
          if [ "$FAIL" = true ]; then
            printf '%s' "$REASONS" | while read -r line; do echo "::error title=Worktree CI Gate::${line#- }"; done
            exit 1
          fi
          echo "✅ All guardrails passed."
