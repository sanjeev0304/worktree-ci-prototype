name: Worktree CI Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  safety-gate:
    name: Safety & Blast Radius Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out code (full history for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run smoke test (node tests/verify-app.js)
        id: smoke
        continue-on-error: true
        run: node tests/verify-app.js

      - name: Analyse blast radius and write executive report
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          CORE_FILE="src/core-engine.js"
          MAX_LINES=80
          AUDIT_REPORT="qa-evidence/PR_AUDIT_REPORT.md"
          AUDIT_SHOT="qa-evidence/latest-ui-proof.png"

          git fetch --no-tags origin main
          RANGE="origin/main...HEAD"

          # Per-file added/removed counts. Binary files show "-", counted as 0.
          NUMSTAT="$(git diff --numstat "$RANGE")"

          ADDED=0
          REMOVED=0
          FILE_ROWS=""
          FILE_COUNT=0
          CORE_TOUCHED=false

          while IFS=$'\t' read -r add del file; do
            [ -z "${file:-}" ] && continue
            [ "$add" = "-" ] && add=0
            [ "$del" = "-" ] && del=0
            FILE_COUNT=$((FILE_COUNT + 1))
            marker=""
            # Generated audit evidence does not count toward the line limit.
            if [[ "$file" == qa-evidence/* ]]; then
              marker=" 🧪 _evidence, not counted_"
            else
              ADDED=$((ADDED + add))
              REMOVED=$((REMOVED + del))
            fi
            if [ "$file" = "$CORE_FILE" ]; then
              CORE_TOUCHED=true
              marker=" ⛔ **RESTRICTED**"
            fi
            FILE_ROWS="${FILE_ROWS}| \`${file}\`${marker} | +${add} | -${del} |"$'\n'
          done <<< "$NUMSTAT"

          # Also catch renames/deletes of the core file.
          if git diff --name-only "$RANGE" | grep -qx "$CORE_FILE"; then
            CORE_TOUCHED=true
          fi

          TOTAL=$((ADDED + REMOVED))

          # Decide verdict.
          FAIL=false
          REASONS=""
          if [ "$CORE_TOUCHED" = true ]; then
            FAIL=true
            CORE_STATUS="🔴 **VIOLATION**: \`${CORE_FILE}\` was modified. Only the Lead Architect (Person A) may change the core layer."
            REASONS="${REASONS}- Restricted core file \`${CORE_FILE}\` was modified."$'\n'
          else
            CORE_STATUS="🟢 **SAFE**: \`${CORE_FILE}\` was not touched."
          fi

          if [ "$TOTAL" -gt "$MAX_LINES" ]; then
            FAIL=true
            SIZE_STATUS="🔴 **TOO LARGE**: ${TOTAL} lines changed (limit ${MAX_LINES})."
            REASONS="${REASONS}- ${TOTAL} lines changed, over the ${MAX_LINES}-line limit. Split this PR."$'\n'
          else
            SIZE_STATUS="🟢 **WITHIN LIMIT**: ${TOTAL} of ${MAX_LINES} lines."
          fi

          # Pre-PR Audit evidence: both files must be updated in this PR.
          CHANGED_FILES="$(git diff --name-only "$RANGE")"
          REPORT_UPDATED=false
          SHOT_UPDATED=false
          grep -qx "$AUDIT_REPORT" <<< "$CHANGED_FILES" && [ -f "$AUDIT_REPORT" ] && REPORT_UPDATED=true
          grep -qx "$AUDIT_SHOT" <<< "$CHANGED_FILES" && [ -f "$AUDIT_SHOT" ] && SHOT_UPDATED=true

          if [ "$REPORT_UPDATED" = true ] && [ "$SHOT_UPDATED" = true ]; then
            AUDIT_STATUS="🟢 **PRESENT**: audit report and UI screenshot were updated in this PR."
          else
            FAIL=true
            AUDIT_STATUS="🔴 **MISSING**: run \`node scripts/run-pre-pr-audit.js\` and commit the files in \`qa-evidence/\`."
            [ "$REPORT_UPDATED" = true ] || REASONS="${REASONS}- \`${AUDIT_REPORT}\` was not updated. The Pre-PR Audit was not run."$'\n'
            [ "$SHOT_UPDATED" = true ] || REASONS="${REASONS}- \`${AUDIT_SHOT}\` was not updated. No fresh UI screenshot proof."$'\n'
          fi

          if [ "$REPORT_UPDATED" = true ] && grep -q "Manual check passed" "$AUDIT_REPORT"; then
            MANUAL_STATUS="🟢 **CONFIRMED**: \"Manual check passed\" is recorded (see report section 5)."
          else
            FAIL=true
            MANUAL_STATUS="🔴 **MISSING**: no \"Manual check passed\" in the audit report. Test on http://localhost:3456, then run \`node scripts/run-pre-pr-audit.js --manual-passed \"<notes>\"\`."
            REASONS="${REASONS}- Manual verification (Protocol RULE 3) not recorded: \"Manual check passed\" is missing from \`${AUDIT_REPORT}\`."$'\n'
          fi

          # Linked GitHub Project task (Guardrail 0), read from the report's task table.
          task_field() {
            [ -f "$AUDIT_REPORT" ] || return 0
            grep -m1 -F "| **$1** | " "$AUDIT_REPORT" | sed -E 's/^\| \*\*[^*]+\*\* \| (.*) \|[[:space:]]*$/\1/' || true
          }
          TASK_ID="$(task_field 'Task ID' | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)"
          TASK_NAME="$(task_field 'Task Name')"
          TASK_TYPE="$(task_field 'Type')"
          TASK_SEVERITY="$(task_field 'Severity')"
          TASK_LIFECYCLE="$(task_field 'Status Lifecycle')"
          LIFECYCLE_RE='^Open -> Testing( -> [A-Za-z]+)* -> Closed$'
          TASK_PROBLEMS=""
          [ -n "$TASK_ID" ] || TASK_PROBLEMS="${TASK_PROBLEMS}no Task ID; "
          [ -n "$TASK_NAME" ] || TASK_PROBLEMS="${TASK_PROBLEMS}no Task Name; "
          [[ "$TASK_TYPE" =~ ^(Task|Issue|Bug)$ ]] || TASK_PROBLEMS="${TASK_PROBLEMS}Type '${TASK_TYPE}' is not Task/Issue/Bug; "
          [[ "$TASK_SEVERITY" =~ ^(Low|Medium|High|Critical)$ ]] || TASK_PROBLEMS="${TASK_PROBLEMS}Severity '${TASK_SEVERITY}' is not Low/Medium/High/Critical; "
          [[ "$TASK_LIFECYCLE" =~ $LIFECYCLE_RE ]] || TASK_PROBLEMS="${TASK_PROBLEMS}lifecycle '${TASK_LIFECYCLE}' is not Open -> Testing -> Closed; "

          # The Task ID must be a real issue in this repository (not a pull request).
          ISSUE_CHECK="not checked"
          if [ -n "$TASK_ID" ]; then
            if [ -z "${GH_TOKEN:-}" ]; then
              ISSUE_CHECK="⚠️ not verified (no token)"
            elif IS_ISSUE="$(gh api "repos/${REPO}/issues/${TASK_ID}" --jq '.pull_request == null' 2>/dev/null)" && [ "$IS_ISSUE" = "true" ]; then
              ISSUE_CHECK="✅ issue #${TASK_ID} exists"
            else
              ISSUE_CHECK="❌ issue #${TASK_ID} not found"
              TASK_PROBLEMS="${TASK_PROBLEMS}issue #${TASK_ID} does not exist in ${REPO}; "
            fi
          fi

          if [ -z "$TASK_PROBLEMS" ]; then
            TASK_STATUS="🟢 **LINKED**: task #${TASK_ID} completed its lifecycle."
          else
            FAIL=true
            TASK_STATUS="🔴 **INVALID OR MISSING**: ${TASK_PROBLEMS%; }."
            REASONS="${REASONS}- GitHub Project task check failed (${TASK_PROBLEMS%; }). Create the task first with \`node scripts/manage-project-task.js create ...\`, then re-run the audit."$'\n'
          fi

          if [ "$SMOKE_OUTCOME" = "success" ]; then
            SMOKE_STATUS="🟢 **PASSED**"
          else
            FAIL=true
            SMOKE_STATUS="🔴 **FAILED**: the app crashed or a smoke check failed."
            REASONS="${REASONS}- Smoke test \`node tests/verify-app.js\` failed."$'\n'
          fi

          [ -z "$FILE_ROWS" ] && FILE_ROWS="| _(no file changes)_ | | |"$'\n'

          {
            echo "# 🛡️ Executive Safety & Blast Radius Report"
            echo
            echo "**PR #${PR_NUMBER}:** ${PR_TITLE}  "
            echo "**Author:** @${PR_AUTHOR} · **Branch:** \`${HEAD_REF}\` → \`main\`"
            echo
            echo "## a) Files modified (${FILE_COUNT})"
            echo
            echo "| File | Added | Removed |"
            echo "|---|---:|---:|"
            printf '%s' "$FILE_ROWS"
            echo
            echo "## b) Lines changed"
            echo
            echo "| Added | Removed | Total | Limit |"
            echo "|---:|---:|---:|---:|"
            echo "| +${ADDED} | -${REMOVED} | **${TOTAL}** | ${MAX_LINES} |"
            echo
            echo "${SIZE_STATUS}"
            echo
            echo "## c) Core architecture status"
            echo
            echo "${CORE_STATUS}"
            echo
            echo "**Smoke test:** ${SMOKE_STATUS}"
            echo
            echo "## d) Pre-PR Audit evidence"
            echo
            echo "| Evidence | Updated in this PR |"
            echo "|---|---|"
            echo "| \`${AUDIT_REPORT}\` | $([ "$REPORT_UPDATED" = true ] && echo '✅ yes' || echo '❌ no') |"
            echo "| \`${AUDIT_SHOT}\` | $([ "$SHOT_UPDATED" = true ] && echo '✅ yes' || echo '❌ no') |"
            echo
            echo "${AUDIT_STATUS}"
            echo
            echo "**Manual verification:** ${MANUAL_STATUS}"
            echo
            echo "## e) 📋 Linked GitHub Project task"
            echo
            echo "| Field | Value | |"
            echo "|---|---|---|"
            echo "| Task ID | ${TASK_ID:+#}${TASK_ID:-—} | ${ISSUE_CHECK} |"
            echo "| Task Name | ${TASK_NAME:-—} | $([ -n "$TASK_NAME" ] && echo ✅ || echo ❌) |"
            echo "| Type | ${TASK_TYPE:-—} | $([[ "$TASK_TYPE" =~ ^(Task|Issue|Bug)$ ]] && echo ✅ || echo ❌) |"
            echo "| Severity | ${TASK_SEVERITY:-—} | $([[ "$TASK_SEVERITY" =~ ^(Low|Medium|High|Critical)$ ]] && echo ✅ || echo ❌) |"
            echo "| Status Lifecycle | ${TASK_LIFECYCLE:-—} | $([[ "$TASK_LIFECYCLE" =~ $LIFECYCLE_RE ]] && echo ✅ || echo ❌) |"
            echo
            echo "${TASK_STATUS}"
            echo
            echo "## f) Final verdict for Lead Architect"
            echo
            if [ "$FAIL" = true ]; then
              echo "> ### ❌ BLOCKED: do not merge"
              echo ">"
              echo "> This PR breaks the safety guardrails in \`docs/SAFETY_GUARDRAILS.md\`:"
              echo
              printf '%s' "$REASONS"
            else
              echo "> ### ✅ APPROVED FOR REVIEW"
              echo ">"
              echo "> Core layer untouched, blast radius within limits, smoke test passed, Pre-PR Audit evidence present, manual check confirmed, GitHub Project task #${TASK_ID} linked and Closed. Safe to review and merge."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Files: ${FILE_COUNT} | +${ADDED} -${REMOVED} = ${TOTAL} | core touched: ${CORE_TOUCHED} | smoke: ${SMOKE_OUTCOME}"

          if [ "$FAIL" = true ]; then
            echo "::error title=Worktree CI Gate::PR blocked. Core touched: ${CORE_TOUCHED}, lines changed: ${TOTAL} (limit ${MAX_LINES}), smoke test: ${SMOKE_OUTCOME}, audit report updated: ${REPORT_UPDATED}, screenshot updated: ${SHOT_UPDATED}, task: ${TASK_PROBLEMS:-ok}."
            exit 1
          fi

          echo "✅ All guardrails passed."
