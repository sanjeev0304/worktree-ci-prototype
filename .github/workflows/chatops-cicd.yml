name: ChatOps CI/CD

# One main branch, four GitHub Pages environments on the gh-pages branch:
#
#   deploy: true | deploy: test   comment on an open PR          -> dev/<taskId>/
#   deploy: <tag>                 comment on an approved PR,     -> git tag <tag> on the PR head, qa/
#                                 or approving a PR that already has that comment
#   PR merged to main             pull_request closed + merged   -> pre-prod/  (task Done: task-lifecycle.yml)
#   release: <name>               comment on a merged PR         -> GitHub Release <name>, prod/, task Deployed
#
# https://sanjeev0304.github.io/worktree-ci-prototype/ is the Environment Portal.
# Each deploy rewrites only its own folder plus the portal, so environments never collide.
#
# Security: commands count only from the repo owner, members and collaborators. All
# scripts run from main; the PR's code is extracted with `git archive` and only read as
# data by the builder, so a PR can never run code with this workflow's write token.
# The Deployed status needs the PROJECT_TOKEN secret to move the board card (see CLAUDE.md).

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write

jobs:
  route:
    name: Route the command
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, 'deploy:') || startsWith(github.event.comment.body, 'release:'))) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.route.outputs.env }}
      sha: ${{ steps.route.outputs.sha }}
      tag: ${{ steps.route.outputs.tag }}
      version: ${{ steps.route.outputs.version }}
      task: ${{ steps.route.outputs.task }}
      pr: ${{ steps.route.outputs.pr }}
      gate: ${{ steps.route.outputs.gate }}
    steps:
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          BODY: ${{ github.event.comment.body }}
          ASSOC: ${{ github.event.comment.author_association || github.event.review.author_association }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          trusted() { case "$1" in OWNER|MEMBER|COLLABORATOR) return 0 ;; *) return 1 ;; esac; }
          say() { gh pr comment "$PR" -R "$REPO" --body "$1" >/dev/null; }
          TAG_RE='^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'

          PR_JSON="$(gh api "repos/$REPO/pulls/$PR")"
          STATE="$(jq -r .state <<< "$PR_JSON")"
          MERGED="$(jq -r .merged <<< "$PR_JSON")"
          HEAD_SHA="$(jq -r .head.sha <<< "$PR_JSON")"
          MERGE_SHA="$(jq -r '.merge_commit_sha // ""' <<< "$PR_JSON")"
          HEAD_REF="$(jq -r .head.ref <<< "$PR_JSON")"
          TASK="$(sed -nE 's#^[a-z]+/([0-9]+)-.*#\1#p' <<< "$HEAD_REF")"
          FIRST="$(printf '%s\n' "$BODY" | head -n1 | tr -d '\r' | sed -E 's/[[:space:]]+$//')"

          if [ "$EVENT" != "pull_request" ] && ! trusted "$ASSOC"; then
            echo "::notice::Ignored: $ACTOR is $ASSOC; only the owner, members and collaborators can deploy."
            exit 0
          fi

          ENV=""; SHA=""; TAG=""
          if [ "$EVENT" = "pull_request" ]; then
            ENV="pre-prod"; SHA="$MERGE_SHA"
          elif [ "$EVENT" = "pull_request_review" ]; then
            # Approval: deploy to QA if a trusted "deploy: <tag>" comment is already on the PR.
            TAG="$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[]
              | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
              | .body | split("\n")[0] | sub("\r$"; "") | sub("\\s+$"; "")
              | capture("^deploy:\\s*(?<t>\\S+)$").t | select(. != "true" and . != "test")' | tail -n1)"
            if [ -z "$TAG" ]; then echo "::notice::Approved, but no 'deploy: <tag>' comment yet; nothing to deploy."; exit 0; fi
            ENV="qa"; SHA="$HEAD_SHA"; out gate "approved by @$ACTOR"
          elif [[ "$FIRST" =~ ^deploy:[[:space:]]*(true|test)$ ]]; then
            ENV="dev"; SHA="$HEAD_SHA"
          elif [[ "$FIRST" =~ ^deploy:[[:space:]]*([^[:space:]]+)$ ]]; then
            ENV="qa"; SHA="$HEAD_SHA"; TAG="${BASH_REMATCH[1]}"
            APPROVER="$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq '.[] | select(.state == "APPROVED" and .commit_id == "'"$HEAD_SHA"'") | .user.login' | tail -n1)"
            if [ -n "$APPROVER" ]; then
              out gate "approved by @$APPROVER"
            elif [ "$ASSOC" = "OWNER" ]; then
              # GitHub blocks approving your own PR, so a solo owner's command is its own sign-off.
              echo "::warning::QA approval gate: no approving review on $HEAD_SHA; accepted as a repo-owner self-check."
              out gate "⚠️ owner self-check by @$ACTOR (no approving review: GitHub blocks self-approval)"
            else
              say "⏸️ **QA deploy of \`$TAG\` is waiting for an approving review** on the latest commit. Approve the PR and it deploys automatically."
              exit 0
            fi
          elif [[ "$FIRST" =~ ^release:[[:space:]]*([^[:space:]]+)$ ]]; then
            ENV="prod"; TAG="${BASH_REMATCH[1]}"; SHA="$MERGE_SHA"
          else
            echo "::notice::Not a ChatOps command: $FIRST"; exit 0
          fi

          if [ "$ENV" = "prod" ] && [ "$MERGED" != "true" ]; then
            say "⛔ **release: $TAG** needs a merged PR. Merge it to main (pre-prod) first, then comment again."; exit 1
          fi
          if { [ "$ENV" = "dev" ] || [ "$ENV" = "qa" ]; } && [ "$STATE" != "open" ]; then
            say "⛔ **$ENV deploys** need an open PR. Use \`release: <name>\` on a merged PR."; exit 1
          fi
          if [ -n "$TAG" ] && { ! [[ "$TAG" =~ $TAG_RE ]] || [ "$TAG" = "true" ] || [ "$TAG" = "test" ]; }; then
            say "⛔ \`$TAG\` is not a valid tag name (letters, digits, \`.\`, \`_\`, \`-\`; max 64)."; exit 1
          fi
          if [ "$ENV" = "dev" ] && [ -z "$TASK" ]; then
            say "⛔ Branch \`$HEAD_REF\` has no task id (\`<type>/<issue-id>-<slug>\`), so there is no \`dev/<taskId>/\` to deploy to."; exit 1
          fi

          case "$ENV" in
            dev) VERSION="${SHA:0:7}" ;;
            pre-prod) VERSION="main@${SHA:0:7}" ;;
            *) VERSION="$TAG" ;;
          esac
          out env "$ENV"; out sha "$SHA"; out tag "$TAG"; out version "$VERSION"; out task "$TASK"; out pr "$PR"
          echo "Route: $ENV · $VERSION · $SHA · task #${TASK:-none} · PR #$PR"

  deploy:
    name: Deploy ${{ needs.route.outputs.env }}
    needs: route
    if: needs.route.outputs.env != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ENV_NAME: ${{ needs.route.outputs.env }}
      SHA: ${{ needs.route.outputs.sha }}
      TAG: ${{ needs.route.outputs.tag }}
      VERSION: ${{ needs.route.outputs.version }}
      TASK: ${{ needs.route.outputs.task }}
      PR: ${{ needs.route.outputs.pr }}
      GATE: ${{ needs.route.outputs.gate }}
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check out main (trusted builder and scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract the app source at the deploy commit (data only, never executed)
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head" main
          git cat-file -e "$SHA^{commit}"
          mkdir -p app-src && git archive "$SHA" src | tar -x -C app-src

      - name: Create the QA tag
        if: env.ENV_NAME == 'qa'
        run: |
          set -euo pipefail
          # An annotated tag's peeled ("^{}") entry is the commit it points at.
          PEELED="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          EXISTING="${PEELED:-$(git ls-remote origin "refs/tags/$TAG" | cut -f1)}"
          if [ -n "$EXISTING" ]; then
            [ "$EXISTING" = "$SHA" ] || { echo "::error::Tag $TAG already exists on another commit."; exit 1; }
            echo "Tag $TAG already points at $SHA; redeploying."
          else
            git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" tag -a "$TAG" "$SHA" -m "QA deploy from PR #$PR"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create the GitHub Release
        if: env.ENV_NAME == 'prod'
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Pick a new release name."; exit 1
          fi
          gh release create "$TAG" -R "$REPO" --target "$SHA" --title "$TAG" --generate-notes

      - name: Move the task to Deployed
        if: env.ENV_NAME == 'prod' && env.TASK != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || github.token }}
        run: |
          node scripts/manage-project-task.js sync --issue "$TASK" --set Deployed \
            --note "Released to PROD as \`$TAG\` from PR #$PR." \
            || echo "::warning::Task #$TASK was not moved to Deployed on the board (is PROJECT_TOKEN set?)."

      - name: Build and push to gh-pages
        id: pages
        run: |
          set -euo pipefail
          case "$ENV_NAME" in
            pre-prod) STATUS="Done" ;;
            prod) STATUS="Deployed" ;;
            *) STATUS="$( [ -n "$TASK" ] && gh issue view "$TASK" -R "$REPO" --json labels \
                 -q '[.labels[].name | select(startswith("status:")) | ltrimstr("status:")] | first // ""' || true)" ;;
          esac
          # Retry: another deploy may push to gh-pages between our fetch and push.
          for attempt in 1 2 3; do
            rm -rf pages && git worktree prune
            if git fetch --no-tags origin gh-pages 2>/dev/null; then
              git worktree add -f -B gh-pages pages FETCH_HEAD
            else
              git worktree add --orphan -b gh-pages pages
            fi
            node scripts/build-gh-pages.js --env "$ENV_NAME" --version "$VERSION" --commit "$SHA" \
              --task "$TASK" --task-status "$STATUS" --src app-src/src --out pages
            git -C pages add -A
            git -C pages -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" \
              commit -q -m "Deploy $ENV_NAME: $VERSION (PR #$PR, ${SHA:0:7})"
            if git -C pages push origin gh-pages; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push to gh-pages after 3 attempts."; exit 1

      - name: Comment the live URL on the PR
        env:
          URL: ${{ steps.pages.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"; NAME="${REPO#*/}"
          PORTAL="https://$OWNER.github.io/$NAME/"
          case "$ENV_NAME" in
            dev) TITLE="🧪 DEV preview deployed" ;;
            qa) TITLE="🔎 QA deployed: tag \`$TAG\` created" ;;
            pre-prod) TITLE="🚦 PRE-PROD deployed from main" ;;
            prod) TITLE="🚀 PROD release \`$TAG\` is live" ;;
          esac
          {
            echo "### $TITLE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Live URL** | $URL |"
            echo "| **Version** | \`$VERSION\` |"
            echo "| **Commit** | \`$SHA\` |"
            [ -n "$TASK" ] && echo "| **Task** | #$TASK |"
            [ -n "$GATE" ] && echo "| **Approval gate** | $GATE |"
            [ "$ENV_NAME" = "prod" ] && echo "| **Release** | https://github.com/$REPO/releases/tag/$TAG |"
            echo "| **Portal** | $PORTAL |"
            echo
            echo "<sub>GitHub Pages can take a minute to publish. [Workflow run]($RUN_URL)</sub>"
          } > comment.md
          gh pr comment "$PR" -R "$REPO" --body-file comment.md

      - name: Report a failed deploy on the PR
        if: failure() && env.PR != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh pr comment "$PR" -R "$REPO" --body "❌ **$ENV_NAME deploy of \`$VERSION\` failed.** See the [workflow run]($RUN_URL)."
